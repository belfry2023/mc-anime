
[general]
	#总开关，默认关闭。开启后女仆才会自言自语/欢迎/对话
	enabled = true
	#允许玩家自定义配置。玩家能否单独配置自己的女仆（自言自语、互聊、自定义 Prompt、Tool 调用）。
	#关闭后玩家设置项置灰，自话/互聊视为启用，自定义 Prompt 不注入、Tool 调用不开启。
	playerOptionEnabled = true
	#是否允许女仆的自言自语/互聊真正调用工具（切换工作任务、坐下、跟随等）。
	#开启后女仆可以在自话/互聊中改变游戏状态，并显著增加 token 消耗，默认关闭。
	#玩家层面的开关还需「允许玩家自定义配置」开启时才生效。
	toolCallEnabled = false

[state_owner_online]
	#态 1：主人在线时女仆是否触发自言自语
	enabled = true
	#态 1 最小触发间隔（秒）
	#Range: 10 ~ 86400
	minIntervalSeconds = 60
	#态 1 最大触发间隔（秒）
	#Range: 10 ~ 86400
	maxIntervalSeconds = 300
	#态 1：半径多少格内有玩家时才触发
	#Range: 1.0 ~ 512.0
	playerRange = 16.0
	#态 1：自言自语保留上下文条数。超过该条数时触发一次遗忘，仅保留最近一次自言自语
	#Range: 1 ~ 50
	keepSelfTalkCount = 5

[state_owner_offline]
	#态 2：主人离线但附近有玩家时女仆是否触发自言自语
	enabled = true
	#态 2 最小触发间隔（秒）
	#Range: 10 ~ 86400
	minIntervalSeconds = 120
	#态 2 最大触发间隔（秒）
	#Range: 10 ~ 86400
	maxIntervalSeconds = 600
	#态 2：半径多少格内有玩家时才触发
	#Range: 1.0 ~ 512.0
	playerRange = 32.0
	#态 2：自言自语保留上下文条数。超过该条数时触发一次遗忘，仅保留最近一次自言自语
	#Range: 1 ~ 50
	keepSelfTalkCount = 3

[welcome]
	#主人登录后女仆是否打招呼。欢迎语不受半径限制，加载区块内的女仆均可触发
	enabled = true
	#玩家登录后的欢迎触发窗口（tick，20 tick = 1 秒）
	#Range: 20 ~ 72000
	welcomeWindowTicks = 600

[rate_limit]
	#欢迎语限流：整个服务器每秒最多放行的欢迎触发次数（所有女仆共享）。
	#防止主人登录时大量女仆同一瞬间并发建立 LLM 连接，导致端点 connect 超时。
	#被限流的欢迎语不发请求、窗口期内每 tick 重试，玩家不会看到报错。
	#Range: 1 ~ 20
	maxTriggerPerSecond = 1
	#自话限流：放行随机间隔区间下限（秒，全局共享）。
	#两次自话派发之间至少间隔该时长，防启动/冷却同相时大量女仆并发建立 LLM 连接。
	#被限流的自话不发请求、随机退避后重试，玩家不会看到报错。
	#Range: 1 ~ 3600
	selfTalkMinIntervalSeconds = 5
	#自话限流：放行随机间隔区间上限（秒），在区间内随机
	#Range: 1 ~ 3600
	selfTalkMaxIntervalSeconds = 8
	#顺延限流：每只女仆忙时积压的自话/互聊请求数上限（默认顺延）。
	#顺延请求会在女仆空闲后按序派发（派发时才构建消息，保证上下文稳定）；
	#积压超出该上限时才吞掉新请求（队列过多才吞，避免挤压自然触发队列）。
	#Range: 1 ~ 10
	deferQueueMax = 2

[prompt]
	#自话输出语言（语言标签，如 zh_cn / en_us / ja_jp，支持任意合法语言标签，非法值回退 zh_cn）。
	#注意：TLM 官方模型的人设设定多为英文，若不显式声明语言，女仆自话可能输出英文。
	#此配置会：1) 作为设定占位符的替换语言；2) 向自话提示词注入对应语言的输出指令；
	#3) 决定 custom/ 目录诊断报告（_diagnostics.md）的语言：中文标签写中文，其余合法语言写英文。
	#自话/欢迎提示词本身已硬编码在 SelfTalkPrompts 中（1.0.1 起不再从本配置读取），
	#旧配置文件中的 selfTalkPrompt / selfTalkPromptOwnerNearby / welcomePrompt 键被忽略，不影响运行。
	selfTalkLanguage = "zh_cn"

[inter_maid_chat]
	#女仆互聊总开关，默认关闭。开启后满足玩家距离与女仆间距离的女仆才会发起互聊
	enabled = false
	#互聊最小触发间隔（秒）
	#Range: 10 ~ 86400
	minIntervalSeconds = 300
	#互聊最大触发间隔（秒）
	#Range: 10 ~ 86400
	maxIntervalSeconds = 600
	#互聊：半径多少格内有玩家时才触发（玩家距离）
	#Range: 1.0 ~ 512.0
	playerRange = 16.0
	#互聊：自身多少格内有另一只女仆时才触发（女仆间距离）
	#Range: 1.0 ~ 512.0
	maidRange = 8.0
	#互聊保留轮数。问/答算一轮，单问无答也算一轮；达到该轮数时触发遗忘，仅保留最近一条消息
	#Range: 1 ~ 50
	keepRounds = 5
	#互聊连续触发概率（0~1），每轮回答后按此概率决定是否让对方继续回应
	#Range: 0.0 ~ 1.0
	chainProbability = 0.3
	#一次互聊会话的最大消息条数（含发起者消息），达到后强制结束本次互聊。为连续概率配到 1.0 等极端配置兜底，防止无限链式往返消耗 token
	#Range: 1 ~ 50
	maxChainRounds = 10
	#互聊对锁：A 对 C 发起互聊后，二者在「连续互聊结束」前互相对锁——
	#不能发起、也不能被发起互聊（其它女仆的随机候选池不再包含这对）。
	#链自然结束/请求失败/女仆死亡卸载时均会提前解锁；该时长仅为
	#回调永不返回等无法感知的异常中断时的超时兜底。
	#Range: 10 ~ 600
	pairLockSeconds = 90

[event_context]
	#环境感知总开关，默认开启。关闭后附近事件与女仆自身感知均不注入。
	#开启后，女仆感知半径内发生的死亡与玩家受伤会被记录，连同女仆自身的着火、
	#缺氧与自身受伤，一起整理成自然语言背景，注入该女仆下一次自言自语/互聊的提示词；
	#欢迎语不注入。死亡只记录玩家、有主人的动物与其他女仆，普通生物死亡不记录。
	#死亡文本取原版本地化消息：专用服务端为英文原文，单人/局域网随客户端语言。
	#这些记录只存在于服务端内存与当次请求，不写入世界存档。
	enabled = true
	#附近死亡与玩家受伤的感知半径（格），不约束女仆自身感知
	#Range: 1.0 ~ 512.0
	range = 32.0
	#每只女仆的事件缓冲容量，死亡、玩家受伤与自身受伤共用，溢出丢弃最旧的一条。
	#缓冲在下一次自言自语或互聊时被取用并清空（谁先派发谁消费）。
	#Range: 1 ~ 20
	maxBufferedEvents = 5
	#玩家受伤事件开关，默认关闭，不影响女仆自身感知。
	#受伤发生频率远高于死亡，开启后提示词噪音明显增多；同样受感知半径约束。
	#只在玩家实际掉血时记录（格挡成功、无敌帧内被忽略的伤害不记）。
	#为控制积压，同一只女仆记录玩家受伤的最小间隔固定为 1 秒（不可配置），
	#因此记录条数不等于实际受击次数。
	hurtEnabled = false
	#女仆自身感知开关，默认开启，与玩家受伤开关相互独立。
	#包含：自身着火、水下缺氧，以及自身实际掉血（含伤害来源）。
	#自身受伤不受感知半径约束，也不需要附近有玩家；只影响该女仆自己下一次
	#自言自语/互聊，不会告知附近其它女仆。
	selfEnabled = true
	#受伤事件有效期（秒），玩家受伤与女仆自身受伤共用。
	#超过该时长的受伤记录在下一次记录或派发时被淘汰，不再注入提示词；
	#调小后已淘汰的记录不会因调大而恢复。死亡记录不设有效期。
	#为避免积压，同一只女仆记录受伤的最小间隔固定为 1 秒（不可配置），
	#短时间内多次受击只会保留其中一部分。
	#Range: 1 ~ 600
	hurtMaxAgeSeconds = 60

[chat_history]
	#自话、欢迎语与女仆互聊的独立展示档案总保留条数（每只女仆各自计算，包含已被手动隐藏的记录）。
	#它只控制原版聊天记录界面里这些消息的保留上限，超出后按最旧顺序淘汰；
	#不控制模型上下文——自话参与模型请求的条数上限固定为 512，不受此项影响。
	#容量代价：每条记录在存档与打开聊天界面的同步包里都带完整正文（自话含 TTS 段），
	#有效自话上下文（最多 512 条完整正文）、自话指纹与 TLM 历史（最多 512 条）
	#写进同一份 AI 数据并整份同步。同步包受原版载荷上限（1 MB）与 NBT 解码上限（2 MiB）约束，
	#档案灌满且单条正文很长时可能超限，表现为该女仆的聊天界面无法打开；
	#建议不超过 2000 左右，配得越大越容易触发。
	#调小后重新读档按最旧淘汰超出部分，被淘汰的展示记录不可恢复。
	#只允许在此配置文件修改，游戏内设置界面不提供该项。
	#Range: 1 ~ 100000
	maxStoredMessages = 1000

[prebuilt_reuse]
	#预制复用的环境匹配下限 n：一条缓存回复的逐 key 环境内容与本次实际注入环境
	#严格相等（key 相同且值完全相同）的数量达到 n，该条才成为候选。
	#调大会让复用更难命中。正整数。
	#Range: 1 ~ 64
	minMatchingContexts = 4
	#旧兼容保留项，已不生效：旧版这里是预制复用的命中概率。issue #108 起
	#概率改由世界设置承载（预制复用设置浮层 → 服务器设置），按主人个人参数解析；
	#保留该键只为避免配置框架把已有键当作未知项移除，运行时不再读取，
	#也不用于新存档初始化或迁移。
	#Range: 0 ~ 100
	hitChancePercent = 60
	#旧兼容保留项，已不生效：旧版这里是预制复用的候选条数下限 m。issue #108 起
	#最低可用条数改由世界设置承载（预制复用设置浮层 → 服务器设置），按主人个人参数解析；
	#保留该键只为避免配置框架把已有键当作未知项移除，运行时不再读取，
	#也不用于新存档初始化或迁移。
	#Range: 1 ~ 100000
	minEligibleEntries = 8
	#每个指纹目录下每个来源子目录的库存条数上限 k：欢迎语与自话两组各自计算。
	#追加时超出上限按存储日期移除最旧条目文件；调小后重启扫描或下一次新增时
	#按同一排序裁剪（只裁剪合法新格式条目，旧格式与损坏文件保留原样）。正整数。
	#Range: 1 ~ 100000
	maxEntriesPerSource = 300

[maid_identity]
	#向「附近实体」上下文补充附近女仆的 UUID 与当前名称，让模型能区分同名女仆、
	#识别改名前后的同一对象。仅影响随机的附近实体情境与 query_game_context 的查询结果，
	#不改动 system 人设，也不拦截模型输出。
	#名称取值：命名牌名称优先，未命名但使用 TLM 内置模型的返回该模型的预置名称
	#（如「博丽灵梦」），使用 YSM 或第三方自定义模型的仍视为未命名。
	#预置名称跟随发起查询的女仆的聊天语言，取不到该语言的翻译时用英文。
	#是否注册此项在启动时读取一次，修改后需重启服务端；
	#女仆名称等数据每次查询时实时读取，改名后下一次查询即为新名称，UUID 不变。
	#专用服务器需修改服务端配置。默认开启。
	enabled = true
	#注册「查询附近女仆」Tool（query_nearby_maids），供模型自行决定是否调用：
	#返回半径固定 32 格内每只女仆的 UUID、当前名称与到调用者的距离。
	#名称取值与上面的上下文注入一致：命名牌名称优先，未命名的 TLM 内置模型用预置名称，
	#未命名的 YSM / 第三方自定义模型视为未命名；预置名称跟随调用者的聊天语言。
	#与上面的上下文注入相互独立——注入是被动地随情境给出，本工具是模型主动取用，
	#两者都只降低模型照抄内部标识符的风险，不拦截输出。
	#工具一旦注册，玩家聊天与自言自语/互聊的请求都会看到它（是否带工具仍由
	#玩家级 Tool 开关决定）。是否注册在启动时读取一次，修改后需重启服务端。
	#默认开启。
	toolEnabled = true

